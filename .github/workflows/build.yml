name: DolphinDotNet Debuggers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/usb-gecko-wiiload-launch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debuggers-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    name: DAP and RSP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tests/DebuggerTests -c Release
      - run: dotnet build tools/DolphinDotNet.DebugAdapter -c Release
      - run: python -m unittest discover -s tests -p test_debug_adapter.py
      - run: python -m unittest discover -s tests -p test_console_launcher.py
      - run: python -m unittest discover -s tests -p test_release_assets.py
  rider-plugin:
    uses: ./.github/workflows/rider.yml
  visual-studio-extension:
    uses: ./.github/workflows/visual-studio.yml
  ci-result:
    if: always()
    runs-on: macos-latest
    needs: [protocol, rider-plugin, visual-studio-extension]
    steps:
      - name: Require every debugger check
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'CHECK'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, result in results.items() if result['result'] != 'success']
          if failed:
              raise SystemExit('Debugger CI failed: ' + ', '.join(failed))
          CHECK
  release-extensions:
    name: Publish built IDE extensions
    runs-on: macos-latest
    needs:
      - ci-result
      - rider-plugin
      - visual-studio-extension
      - protocol
    # Publish only extensions produced by this successful main run.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.rider-plugin.result == 'success' || needs.visual-studio-extension.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Rider package built during this run
        if: needs.rider-plugin.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DolphinDotNet-Rider-plugin
          path: dist/extensions/rider
      - name: Download Visual Studio package built during this run
        if: needs.visual-studio-extension.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DolphinDotNet-VisualStudio-plugin
          path: dist/extensions/visual-studio
      - name: Create downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          RIDER_RESULT: ${{ needs.rider-plugin.result }}
          VS_RESULT: ${{ needs.visual-studio-extension.result }}
        run: |
          TAG="build-${BUILD_RUN}-${BUILD_ATTEMPT}"
          package_args=()
          if [ "$RIDER_RESULT" = success ]; then package_args+=(--rider-dir dist/extensions/rider); fi
          if [ "$VS_RESULT" = success ]; then package_args+=(--visual-studio-dir dist/extensions/visual-studio); fi
          mkdir -p dist
          python3 scripts/release_assets.py "${package_args[@]}" > dist/release-assets.txt
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < dist/release-assets.txt
          gh release create "$TAG" "${assets[@]}" \
            --target "$BUILD_SHA" \
            --title "DolphinDotNet build ${BUILD_RUN} (attempt ${BUILD_ATTEMPT})" \
            --notes "Installable IDE extensions built from commit ${BUILD_SHA}. Native GameCube builds and Dolphin smoke tests are not part of the debugger CI matrix. Verified by CI run https://github.com/${GH_REPO}/actions/runs/${BUILD_RUN}." \
            --prerelease
