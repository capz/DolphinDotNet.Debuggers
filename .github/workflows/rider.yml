name: Rider plugin
on:
  workflow_call:
    inputs:
      launcher-artifact:
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rider-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  launcher:
    if: inputs.launcher-artifact == ''
    uses: ./.github/workflows/launcher.yml
    with:
      artifact-name: DolphinDotNet-GameCube-launcher-rider
  package:
    needs: launcher
    if: ${{ !cancelled() && (needs.launcher.result == 'success' || (needs.launcher.result == 'skipped' && inputs.launcher-artifact != '')) }}
    name: Rider attach plugin
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.launcher-artifact || 'DolphinDotNet-GameCube-launcher-rider' }}
          path: out/launcher
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile, test real adapter integration, package and verify Rider compatibility
        working-directory: plugins/rider
        run: gradle --no-daemon test buildPlugin verifyPlugin
      - name: Verify plugin ZIP includes the adapter and serial runtime dependencies
        run: |
          python3 - <<'PYZIP'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from verify_rider import verify
          packages = list(Path('plugins/rider/build/distributions').glob('*.zip'))
          assert len(packages) == 1, packages
          verify(packages[0])
          PYZIP
      - uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-Rider-plugin
          path: plugins/rider/build/distributions/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Rider-plugin-test-reports
          path: |
            plugins/rider/build/reports/tests/
            plugins/rider/build/reports/pluginVerifier/
